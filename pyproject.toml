[project]
name = "ml-proyecto-weatheraus"
version = "0.1.0"
description = "Proyecto ML para predicción de lluvia en Australia"
authors = [ { name = "Federico Gómez", email = "fjgomezc@eafit.edu.co" } ]
license = {text = "GPL-3.0"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "plotly",
    "xgboost",
    "lightgbm",
    "category_encoders",
    "shap",
    "imbalanced-learn"
]

[tool.setuptools.packages.find]
where = ["src"]
